name: Bug report
description: Something in ADRC-in-Ada behaves against its specification.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md and MAINTAINERS.md (scope) first. Security issues
        go through private vulnerability reporting, not this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior vs expected behavior, per SPECIFICATION.md.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal controller configuration, plant, and input sequence (synthetic data only — never real credentials), plus the observed vs expected response.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tracking differentiator (TD)
        - Extended state observer (LESO)
        - Control law
        - Controller composition
        - Build / Alire crate
        - Documentation
    validations:
      required: true
